[package]
name = "huskynext"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Controle de iluminação do Husky Sled para Linux, com interface iced"
license = "MIT"

[dependencies]
iced = { version = "0.14", features = ["image", "canvas", "tokio"] }
hidapi = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6"

[profile.release]
lto = "thin"
strip = true
